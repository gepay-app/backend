# Profil `test`: nilai dev lokal yang sebelumnya datang dari `.env` (yang tidak
# otomatis dibaca saat `./mvnw test`), supaya context-load test bisa jalan dengan
# Postgres/Redis lokal (lihat agents.md §5). Bukan secret.
app:
  cors:
    allowed-origins: http://localhost:3000

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gepay
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      username: root
      password: root
